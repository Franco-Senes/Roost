[package]
name = "roost"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Liviano servidor doméstico familiar con tienda de apps, fotos y agente de IA."

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }

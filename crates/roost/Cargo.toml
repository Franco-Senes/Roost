[package]
name = "roost"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Liviano servidor doméstico familiar con tienda de apps, fotos y agente de IA."

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
blake3 = "1"
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
chacha20poly1305 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.2"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
sysinfo = { version = "0.40", default-features = false, features = ["component", "disk", "system"] }
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
